[project]
name = "call-insights-newsletter"
version = "0.1.0"
description = "Turn recurring questions from customer calls into a newsletter draft that a human approves."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fanny Rabinovitch" }]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E701"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
